:root{
  --bg:#000; --text:#f4f4f4; --muted:rgba(255,255,255,.58); --accent:#4a9bea;
  --g-bg:linear-gradient(160deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.045) 32%,rgba(255,255,255,.025) 62%,rgba(255,255,255,.085) 100%);
  --g-rim:rgba(255,255,255,.15);
  --g-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.09),inset 1px 0 0 rgba(255,255,255,.10),inset -1px 0 0 rgba(255,255,255,.06),inset 0 0 24px rgba(255,255,255,.03),0 18px 42px rgba(0,0,0,.55);
  --btn:linear-gradient(180deg,#4aa0ff,#1f63d6);
  --spring:cubic-bezier(.32,.72,0,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;touch-action:manipulation}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:"IRANSansX",system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;color:var(--text);font-size:15px;overflow-x:hidden}
a{color:inherit;text-decoration:none}
svg{display:block;fill:currentColor}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}

#app{min-height:100vh;min-height:100dvh;max-width:900px;margin:0 auto;position:relative}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#000}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.aurora i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(closest-side,rgba(52,126,255,.30),transparent);animation:floatA 22s ease-in-out infinite}
.aurora i:nth-child(2){width:60vmax;height:60vmax;right:-28vmax;top:28%;background:radial-gradient(closest-side,rgba(40,190,255,.16),transparent);animation:floatB 27s ease-in-out infinite}
.aurora i:nth-child(3){width:65vmax;height:65vmax;left:-10vmax;bottom:-38vmax;background:radial-gradient(closest-side,rgba(90,90,255,.22),transparent);animation:floatA 31s ease-in-out infinite reverse}
@keyframes floatA{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(9vmax,7vmax,0)}}
@keyframes floatB{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-8vmax,-6vmax,0)}}

.glass{position:relative;isolation:isolate;overflow:hidden;background:var(--g-bg);border:1px solid var(--g-rim);box-shadow:var(--g-shadow);
  -webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 85% at 10% 0%,rgba(255,255,255,.17) 0%,rgba(255,255,255,.05) 38%,transparent 62%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:#141416}}

#stage{position:relative;z-index:1;padding:calc(22px + env(safe-area-inset-top)) 12px calc(128px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.js .cafe,.js .label,.js .card{opacity:0}

/* hero */
.cafe{border-radius:32px;padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  background:linear-gradient(160deg,rgba(74,160,255,.20) 0%,rgba(255,255,255,.05) 45%,rgba(255,255,255,.03) 100%);border-color:rgba(120,180,255,.32)}
.cafe::before{background:radial-gradient(90% 70% at 50% 0%,rgba(90,170,255,.38) 0%,transparent 70%)}
.cafe .ci{width:64px;height:64px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;

    s.onerror = function () { s.remove(); load(lib, i + 1, cb); };
    document.head.appendChild(s);
  }
  var pending = LIBS.length;
  LIBS.forEach(function (l) { load(l, 0, function () { if (--pending === 0) start(); }); });
  setTimeout(start, 6500);   // never wait forever

  function start() {
    if (started) return; started = true;
    var g = window.gsap, done = false, inter = false, lenis = null, reduce = false;
    try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (!g || reduce) { show(); return; }

    /* Lenis smooth scroll, driven by the GSAP ticker */
    try {
      if (window.Lenis) {
        lenis = new Lenis({ duration: 1.15, smoothWheel: true, easing: function (t) { return Math.min(1, 1.001 - Math.pow(2, -10 * t)); } });
        g.ticker.add(function (t) { lenis.raf(t * 1000); });
        g.ticker.lagSmoothing(0);
      }
    } catch (e) { lenis = null; }

    var fine = false; try { fine = matchMedia('(hover:hover) and (pointer:fine)').matches; } catch (e) {}

    /* interactions: 3D tilt on cards */
    function interactions() {
      if (inter) return; inter = true;
      all('.card').forEach(function (c) {
        g.set(c, { transformPerspective: 800 });
        var rx = g.quickTo(c, 'rotationX', { duration: .6, ease: 'power3.out' }),
            ry = g.quickTo(c, 'rotationY', { duration: .6, ease: 'power3.out' }),
            sc = g.quickTo(c, 'scale', { duration: .35, ease: 'power3.out' });
        if (fine) {
          c.addEventListener('pointermove', function (e) {
            var r = c.getBoundingClientRect();
            ry(((e.clientX - r.left) / r.width - .5) * 14); rx(-((e.clientY - r.top) / r.height - .5) * 14); sc(1.03);
          });
          c.addEventListener('pointerleave', function () { rx(0); ry(0); sc(1); });
        }
        c.addEventListener('pointerdown', function () { sc(.95); });
        c.addEventListener('pointerup', function () { sc(fine ? 1.03 : 1); });
        c.addEventListener('pointercancel', function () { sc(1); });
      });

    }

    /* intro: staggered 3D entrance */
    function intro() {
      if (done) return null; done = true;
      var hero = all('.cafe'), lab = all('.label'), cards = all('.card'), items = hero.concat(lab, cards);
      g.set(items, { opacity: 0, y: 30 });
      g.set('#cr', { y: 24 });
      show();
      var tl = g.timeline({ defaults: { ease: 'power3.out' } });
      tl.to(hero, { opacity: 1, y: 0, duration: .9 })
        .to(lab, { opacity: 1, y: 0, duration: .6 }, '-=.55')
        .to(cards, { opacity: 1, y: 0, duration: .85, stagger: .09 }, '-=.5')
        .to('#cr', { y: 0, duration: .9, ease: 'back.out(1.5)' }, '-=.55')
        .eventCallback('onComplete', function () { g.set(items, { clearProps: 'opacity,y' }); g.set('#cr', { clearProps: 'transform' }); interactions(); });
      g.fromTo('.cafe .ci', { rotation: -12, scale: .8 }, { rotation: 0, scale: 1, duration: 1.1, ease: 'elastic.out(1,.55)', delay: .25 });
      return tl;
    }

    /* Barba.js: runs the intro as its "once" transition and wires interactions in the view lifecycle.
       Links are external, so Barba never hijacks navigation. */
    try {
      if (window.barba) {
        barba.init({
          preventRunning: true,
          prevent: function () { return true; },
          transitions: [{ name: 'intro', once: function () { return intro(); } }],
          views: [{ namespace: 'home', afterEnter: function () { if (done) interactions(); } }]
        });
      }
    } catch (e) {}
    setTimeout(intro, 800);   // safety net if Barba did not fire "once"
  }
})();

</script>
</body>
</html>
